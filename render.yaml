# One-click deploy on Render: New + > Blueprint > point at this repo.
services:
  - type: web
    name: shopsphere
    runtime: docker
    plan: starter # persistent disks need a paid plan
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_USER
        value: "true"
    disk:
      name: shopsphere-data
      mountPath: /data
      sizeGB: 1
