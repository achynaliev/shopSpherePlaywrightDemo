name: Build & E2E (Azure Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC sign-in to Azure
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
      # Test accounts; global-setup.js registers them in the fresh CI database.
      PASSWORD: ${{ secrets.E2E_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.E2E_WRONG_PASSWORD }}
      REGISTRATION_EMAIL: ${{ secrets.E2E_REGISTRATION_EMAIL }}
      REGULAR_USER: ${{ secrets.E2E_REGULAR_USER }}
      REGULAR_USER2: ${{ secrets.E2E_REGULAR_USER2 }}
      REGULAR_USER3: ${{ secrets.E2E_REGULAR_USER3 }}
      REGULAR_USER4: ${{ secrets.E2E_REGULAR_USER4 }}
      REGULAR_USER6: ${{ secrets.E2E_REGULAR_USER6 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Server unit tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The Playwright webServer starts the built app on the runner; the cloud browsers reach it over <loopback>.
      - name: Run Playwright tests on Azure
        working-directory: tests
        run: npm run test:azure

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14
